<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>StreamKEK settings</title>
    <link rel="stylesheet" href="../extension-pages/page.css" />
    <link rel="stylesheet" href="settings-window.css" />
    <script src="../settings.js"></script>
    <script src="../features/streams/sites.js"></script>
    <script src="../features/chat/chat-words.js"></script>
    <script src="../extension-pages/page-theme.js"></script>
  </head>
  <body>
    <aside class="nav">
      <div class="brand">
        <img src="../../icons/48.png" alt="" />
        <span>StreamKEK</span>
      </div>
      <input id="search" class="search" type="search" placeholder="Search settings" aria-label="Search settings" autocomplete="off" spellcheck="false" />
      <nav id="categories" class="categories" aria-label="Setting categories"></nav>
      <nav id="feedback-category" class="feedback-category" aria-label="Backup and feedback"></nav>
      <p id="version" class="version"></p>
    </aside>
    <main class="content">
      <button id="close" class="close" type="button" title="Close" aria-label="Close settings" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6.7 5.3 12 10.6l5.3-5.3 1.4 1.4-5.3 5.3 5.3 5.3-1.4 1.4-5.3-5.3-5.3 5.3-1.4-1.4 5.3-5.3-5.3-5.3 1.4-1.4Z" /></svg>
      </button>
      <div id="groups" class="groups"></div>
      <p id="no-results" class="no-results" role="status" hidden>No settings match your search.</p>
    </main>
    <script src="backup.js"></script>
    <script src="settings-window.js"></script>
  </body>
</html>

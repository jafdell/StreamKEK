<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>StreamKEK</title>
    <link rel="stylesheet" href="../../../shared/page.css" />
    <link rel="stylesheet" href="manager.css" />
    <script src="../../../settings.js"></script>
    <script src="../../../shared/page-theme.js"></script>
  </head>
  <body>
    <h1>YouTube channels</h1>
    <form id="add">
      <input id="input" type="text" placeholder="@handle or channel link" autocomplete="off" spellcheck="false" />
      <button id="submit" type="submit">Add</button>
    </form>
    <p id="message" role="status" hidden></p>
    <label id="subs">
      <span>
        <span class="subs-title">Show my live YouTube subscriptions</span>
        <span id="subs-state" class="state"></span>
      </span>
      <input id="subs-toggle" class="skek-switch" type="checkbox" role="switch" checked />
    </label>
    <ul id="list"></ul>
    <p id="empty" hidden>Add a channel and it will appear in Twitch's sidebar whenever it goes live.</p>
    <script src="manager.js"></script>
  </body>
</html>
